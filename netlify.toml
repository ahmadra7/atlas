[build]
  # Proven path: Next static export; serve apps/web/out (includes public/_redirects).
  command = "npm run build -w @atlas/web"
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[build]
  # Export Next to apps/web/out, then mirror into repo-root static files Netlify serves.
  command = "npm run publish:static"
  publish = "."

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
